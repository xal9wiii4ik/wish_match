services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/wishmatch_test
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
      args:
        # Empty base URL → client calls relative /v1, which nginx proxies to app.
        VITE_API_BASE_URL: ""
        # Talk to the real backend (auth, profile, wishes, swipes, matches,
        # categories). Set to "true" to run the UI on in-memory demo data.
        VITE_USE_MOCKS: "false"
    restart: on-failure
    depends_on:
      - app
    ports:
      - "3000:80"

volumes:
  pgdata:
